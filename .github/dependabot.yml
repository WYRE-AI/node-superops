# Canonical Dependabot config for the wyre-technology *-mcp / node-* fleet.
#
# Goal: keep PR volume manageable for a small team. Updates are GROUPED so a
# repo gets a handful of PRs per week instead of one-per-package, and the
# dependabot-janitor (daily) auto-merges the green grouped PRs. Only
# PRODUCTION-dependency MAJOR bumps land as individual PRs for human review,
# since those can carry behavioural breaking changes a green test suite misses.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # All dev/CI tooling (eslint, vitest, typescript, @types/*, etc.) incl.
      # majors → ONE PR. The janitor auto-merges it when CI is green.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]
      # Production minor + patch → ONE PR. Auto-merged when green.
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Production MAJORS are intentionally NOT grouped → individual PRs, held for
    # human review (never auto-merged).
    ignore:
      # ip-address (GHSA, affects <=10.3.0) is unreachable, not unaddressed.
      # It's nested 3 deep: @semantic-release/npm -> npm (bundled) -> socks ->
      # ip-address@10.2.0. `npm` ships with bundleDependencies covering its
      # entire tree, so it's vendored/pre-resolved at publish time — verified
      # empirically 2026-08-06 (on node-ninjaone) that a package.json
      # `overrides` pin has ZERO effect on this path
      # (node_modules/npm/node_modules/ip-address stayed at 10.2.0 after npm
      # install with the override in place). No amount of top-level
      # dependency management in THIS repo can reach it; only a new `npm`
      # release bundling a patched socks/ip-address closes this. Without this
      # ignore, Dependabot's daily Security job retries and fails
      # (security_update_not_possible) every day, which is worse than silent —
      # a permanently-red scheduled job trains everyone to stop looking at it,
      # which could mask an unrelated, actually-fixable advisory later.
      # The underlying GHSA alert stays open/visible on the repo's Security >
      # Dependabot alerts tab regardless of this ignore — this only stops the
      # doomed daily PR-open attempt, it does not dismiss the vulnerability.
      # Revisit: no automatic re-check exists for an `ignore` rule — periodically
      # confirm whether a newer npm (check `npm view npm dependencies` chain,
      # or just remove this ignore and see if Dependabot succeeds) bundles a
      # fixed ip-address, then remove this block.
      - dependency-name: "ip-address"

      # typescript 7.x breaks this fleet's toolchain: DTS emit (tsup/rollup-plugin-dts
      # TS5101 baseUrl-deprecated-as-error), and typescript-eslint (still <6.1.0 as of
      # 8.66.0, no TS7 support yet). Has broken main 3x on some repos because Dependabot
      # has no memory of a prior manual revert and just re-proposes the same major again.
      # Deliberate hold, not a permanent blind -- remove once typescript-eslint + the
      # tsup/DTS toolchain support TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

